<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — billboard 1480×640</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('inter-600.woff2') format('woff2');
      }

      :root {
        --deep: #0d2029;
        --sky: #a2c5d3;
        --cream: #faf5ea;
        --sun: #ffcf7a;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #000;
      }

      /* The render script crops the top-left 1480×640 of the page. */
      .board {
        position: relative;
        width: 1480px;
        height: 640px;
        overflow: hidden;
        background: var(--deep);
        font-family: 'Inter', sans-serif;
        color: var(--cream);
      }

      /* Dawn light lifting off the horizon, echoing the logo's rising sun. */
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(40% 66% at 23% 52%, rgba(255, 197, 108, 0.32) 0%, rgba(255, 197, 122, 0) 62%),
          radial-gradient(80% 130% at 82% 10%, rgba(96, 168, 198, 0.5) 0%, rgba(13, 32, 41, 0) 60%),
          linear-gradient(155deg, #16394a 0%, #0e2531 52%, #0a1c25 100%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 176px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 26px;
        border: 3px solid rgba(162, 197, 211, 0.32);
        border-radius: 20px;
      }

      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 350px 1fr;
        align-items: center;
        gap: 76px;
        padding: 62px 78px 74px;
      }

      .mark {
        display: grid;
        justify-items: center;
        gap: 26px;
      }

      .mark img {
        width: 318px;
        height: auto;
        filter: brightness(1.18) drop-shadow(0 12px 36px rgba(0, 0, 0, 0.5));
      }

      .badge {
        display: inline-block;
        padding: 9px 20px 10px;
        white-space: nowrap;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--cream);
        background: rgba(162, 197, 211, 0.16);
        border: 2px solid rgba(162, 197, 211, 0.42);
        border-radius: 999px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--sun);
      }

      .eyebrow::before {
        content: '';
        width: 52px;
        height: 5px;
        border-radius: 3px;
        background: var(--sun);
      }

      h1 {
        margin-top: 18px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 116px;
        line-height: 0.92;
        letter-spacing: -0.02em;
        text-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      }

      h1 em {
        font-style: normal;
        color: var(--sky);
      }

      .sub {
        margin-top: 22px;
        font-size: 31px;
        font-weight: 600;
        line-height: 1.3;
        color: rgba(250, 245, 234, 0.92);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 36px;
      }

      .url {
        padding: 15px 32px 17px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 52px;
        color: #0d2029;
        background: var(--sky);
        border-radius: 14px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      }

      .free {
        padding: 15px 30px 17px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 48px;
        text-transform: uppercase;
        color: #2a1c05;
        background: var(--sun);
        border-radius: 14px;
        box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1480 176" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4e93ad" />
            <stop offset="1" stop-color="#255b73" />
          </linearGradient>
        </defs>
        <path
          fill="#a2c5d3"
          opacity="0.13"
          d="M0,74 C250,124 500,22 748,48 C996,74 1236,150 1480,100 L1480,176 L0,176 Z"
        ></path>
        <path
          fill="url(#sea)"
          d="M0,124 C290,74 536,162 782,138 C1028,114 1276,74 1480,138 L1480,176 L0,176 Z"
        ></path>
        <path
          fill="none"
          stroke="#cfe7f0"
          stroke-width="3"
          opacity="0.55"
          d="M0,124 C290,74 536,162 782,138 C1028,114 1276,74 1480,138"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="mark">
          <img src="../../public/logo.webp" alt="The Tide" />
          <p class="badge">Read by hundreds of Coasties</p>
        </div>

        <div class="copy">
          <p class="eyebrow">The Coast's newsletter</p>
          <h1>Your week<br />on the <em>Coast.</em></h1>
          <p class="sub">Local stories, news &amp; events — every week.</p>
          <div class="cta">
            <div class="url">thetide.co.nz</div>
            <div class="free">Free</div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
