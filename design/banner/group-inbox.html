<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide Facebook group banner — inbox 1640×856</title>
    <style>
      /* Fonts live with the billboard pages so there's one checked-in copy of
         each: Baloo 2 (headline), Archivo Black (URL tag), Inter (the rest). */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette tokens named after bizdata/docs/BRANDING.md §1, same as
         gardening-club.html. No off-palette colour on this one — it points at
         the newsletter, not at Facebook, so nothing needs Facebook's blue. */
      :root {
        --foam: #faf5ea;
        --sand: #f0e7d6;
        --harbor: #23313c;
        --slate: #5a6672;
        --steel: #45758c;
        --seaglass: #a2c5d3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1640×856 of the page — Facebook's
         group cover size. Critical copy is kept inside generous paddings so it
         survives Facebook's mobile crop of the sides and bottom. */
      .banner {
        position: relative;
        width: 1640px;
        height: 856px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--harbor);
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--foam) 0%, var(--sand) 62%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 190px;
        display: block;
      }

      .waves path {
        fill: var(--seaglass);
      }

      .waves .wave-back {
        opacity: 0.45;
      }

      .frame {
        position: absolute;
        inset: 30px;
        border: 4px solid rgba(69, 117, 140, 0.3);
        border-radius: 38px;
      }

      /* Copy on the left, an envelope tile and the logo stacked on the right —
         the same two-column shape facebook.html and gardening-club.html use.
         padding-bottom reserves the full wave height plus clearance so no copy
         sits on the waves (BRANDING §2). */
      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 300px;
        align-items: center;
        gap: 64px;
        padding: 96px 110px 236px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 20px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--steel);
      }

      .eyebrow::before {
        content: '';
        width: 54px;
        height: 4px;
        border-radius: 2px;
        background: var(--steel);
      }

      h1 {
        margin-top: 22px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 96px;
        line-height: 1.03;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--harbor);
      }

      h1 em {
        font-style: normal;
        color: var(--steel);
      }

      .sub {
        margin-top: 26px;
        max-width: 760px;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
      }

      .url {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 34px 21px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 34px;
        color: var(--foam);
        background: var(--harbor);
        border-radius: 18px;
        box-shadow: 0 16px 34px rgba(35, 49, 60, 0.24);
      }

      .url svg {
        width: 34px;
        height: 34px;
        display: block;
      }

      /* The logo is portrait (783×979), so the stack is sized off its rendered
         height: tile + gap + logo has to stay inside main's content box or the
         logo's bottom is cropped by the banner edge. */
      .flank {
        display: grid;
        justify-items: center;
        gap: 28px;
      }

      .tile {
        width: 168px;
        height: 168px;
        display: block;
        filter: drop-shadow(0 18px 34px rgba(35, 49, 60, 0.22));
      }

      .tile .tile-bg {
        fill: var(--steel);
      }

      .tile .tile-stroke {
        stroke: var(--foam);
      }

      .logo {
        width: 168px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1080 104" preserveAspectRatio="none" aria-hidden="true">
        <path
          class="wave-back"
          d="M0,42 C182,73 365,12 545,28 C727,42 902,90 1080,59 L1080,104 L0,104 Z"
        ></path>
        <path
          d="M0,73 C211,42 391,95 571,80 C751,66 931,42 1080,80 L1080,104 L0,104 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="copy">
          <!-- EDIT ME: the eyebrow, the two headline lines, the line under them
               and the URL pill are the whole banner. The headline is set at a
               fixed size and told not to wrap, so keep each line about this
               long — a longer line runs into the flank column instead of
               shrinking. A group cover image can't be hyperlinked, so the pill
               names the address rather than saying "click here". -->
          <p class="eyebrow">For everyone in this group</p>
          <h1>Get The Tide<br />in your <em>inbox</em></h1>
          <p class="sub">
            The week's local news, stories &amp; events from the Coast &mdash;
            free, every Thursday at 8am.
          </p>
          <div class="cta">
            <div class="url">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9.2" stroke="#faf5ea" stroke-width="1.9" />
                <path
                  d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9Z"
                  stroke="#faf5ea"
                  stroke-width="1.9"
                  stroke-linejoin="round"
                />
              </svg>
              thetide.co.nz
            </div>
          </div>
        </div>

        <div class="flank">
          <svg class="tile" viewBox="0 0 100 100" aria-hidden="true">
            <rect class="tile-bg" width="100" height="100" rx="24" />
            <rect
              class="tile-stroke"
              x="20"
              y="30"
              width="60"
              height="42"
              rx="6"
              fill="none"
              stroke-width="5"
            />
            <path
              class="tile-stroke"
              d="M22 34l28 22 28-22"
              fill="none"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>

          <img class="logo" src="../../public/logo.webp" alt="The Tide" />
        </div>
      </main>
    </div>
  </body>
</html>
