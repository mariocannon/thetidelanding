<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — partner invite 1200×630</title>
    <style>
      /* Fonts come from ../billboard/ so there's one checked-in copy of each:
         Baloo 2 (headline), Archivo Black (contact tag), Inter (the rest). */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1200×630 of the page — the
         standard og:image / Twitter summary_large_image size. Doubles as an
         email header and a LinkedIn link card. */
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 132px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 24px;
        border: 3px solid rgba(69, 117, 140, 0.3);
        border-radius: 22px;
      }

      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 244px 1fr;
        align-items: center;
        gap: 56px;
        /* Bottom pad clears the 132px wave strip — copy never on the waves. */
        padding: 54px 70px 148px;
      }

      .mark {
        display: grid;
        justify-items: center;
        gap: 20px;
      }

      .mark img {
        width: 232px;
        height: auto;
        filter: drop-shadow(0 10px 26px rgba(35, 49, 60, 0.16));
      }

      .badge {
        display: inline-block;
        padding: 8px 18px 9px;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 2px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before {
        content: '';
        width: 46px;
        height: 4px;
        border-radius: 2px;
        background: var(--sea);
      }

      h1 {
        margin-top: 16px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 66px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 18px;
        max-width: 40rem;
        font-size: 23px;
        font-weight: 600;
        line-height: 1.4;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 30px;
      }

      .tag {
        padding: 13px 26px 15px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 26px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 13px;
        box-shadow: 0 12px 28px rgba(35, 49, 60, 0.26);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1200 132" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,56 C200,96 400,18 600,36 C800,54 1000,112 1200,72 L1200,132 L0,132 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,92 C232,56 430,120 630,102 C830,84 1030,56 1200,100 L1200,132 L0,132 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="mark">
          <img src="../../public/logo.webp" alt="The Tide" />
          <span class="badge">The Coast's newsletter</span>
        </div>

        <div class="copy">
          <!-- EDIT ME: eyebrow, two headline lines, one sub line. Fixed size,
               no wrap on the headline — keep each line about this width. -->
          <p class="eyebrow">Local partnerships</p>
          <h1>Your customers<br />are our <em>readers.</em></h1>
          <p class="sub">
            Got a mailing list on the Coast? Let's cross-promote — you to your
            people, us to hundreds of Coasties. Free, local, mutual.
          </p>
          <div class="cta">
            <span class="tag">hello@thetide.co.nz</span>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
