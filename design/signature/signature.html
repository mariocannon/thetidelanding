<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — email signature 520×200</title>
    <style>
      /* Fonts live with the billboard pages so there's one checked-in copy of
         each: Baloo 2 (the name), Inter (everything else). */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 520×200 of the page. */
      .sig {
        position: relative;
        width: 520px;
        height: 200px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      /* The site's own background wash, tightened to the card's crop. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 34px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 8px;
        border: 2px solid rgba(69, 117, 140, 0.3);
        border-radius: 14px;
      }

      main {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px 24px 26px;
      }

      /* Already a circle with its ring baked in — see portrait.py. Kept as a
         flat PNG so Outlook, which drops border-radius on images, matches. */
      .portrait {
        flex: none;
        width: 124px;
        height: 124px;
        display: block;
        filter: drop-shadow(0 7px 16px rgba(35, 49, 60, 0.18));
      }

      .copy {
        flex: 1;
        min-width: 0;
        display: grid;
        justify-items: start;
      }

      .name {
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 31px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--ink);
      }

      /* The rule under the name, as in a printed masthead. */
      .rule {
        width: 100%;
        height: 2px;
        margin: 8px 0 9px;
        border-radius: 1px;
        background: rgba(69, 117, 140, 0.32);
      }

      .role {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--ink);
      }

      .role em {
        font-style: normal;
        color: var(--sea);
      }

      .role span {
        color: var(--sky);
        font-weight: 600;
      }

      .contact {
        margin-top: 11px;
        display: grid;
        gap: 4px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
        white-space: nowrap;
        color: var(--slate);
      }

      .contact div {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .contact svg {
        flex: none;
        width: 14px;
        height: 14px;
        color: var(--sea);
      }

      /* The logo is portrait, so at 200px tall its width is what the paddings
         leave, not a free choice. */
      .logo {
        flex: none;
        width: 60px;
        height: auto;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div class="sig">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 520 34" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,14 C88,24 176,4 262,9 C350,14 434,29 520,18 L520,34 L0,34 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,24 C102,14 188,32 275,26 C362,22 448,14 520,26 L520,34 L0,34 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <img class="portrait" src="../../public/signature/portrait.png" alt="" />

        <div class="copy">
          <!-- EDIT ME: these four lines are the whole signature. They're set at
               a fixed size and told not to wrap, so a line much longer than the
               name runs into the logo instead of shrinking. -->
          <p class="name">Mario Cannon</p>
          <div class="rule"></div>
          <p class="role">Publisher <span>|</span> <em>The Tide</em></p>
          <div class="contact">
            <div>
              <svg viewBox="0 0 20 16" fill="none" aria-hidden="true">
                <rect x="1" y="1" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2" />
                <path d="M2 3l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              hello@thetide.co.nz
            </div>
            <div>
              <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="2" />
                <path d="M1 10h18M10 1c2.6 2.6 2.6 15.4 0 18M10 1C7.4 3.6 7.4 16.4 10 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              thetide.co.nz
            </div>
          </div>
        </div>

        <img class="logo" src="../../public/logo.webp" alt="The Tide" />
      </main>
    </div>
  </body>
</html>
