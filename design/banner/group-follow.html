<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide Facebook group banner — follow 1640×856</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      :root {
        --foam: #faf5ea;
        --sand: #f0e7d6;
        --harbor: #23313c;
        --slate: #5a6672;
        --steel: #45758c;
        --seaglass: #a2c5d3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* 1640×856, Facebook's group cover size. This one leads with the reader's
         own situation ("you follow the group") the way the editor's voice does
         — assume the shared experience, then land the ask. */
      .banner {
        position: relative;
        width: 1640px;
        height: 856px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--harbor);
      }

      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--foam) 0%, var(--sand) 62%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 190px;
        display: block;
      }

      .waves path {
        fill: var(--seaglass);
      }

      .waves .wave-back {
        opacity: 0.45;
      }

      .frame {
        position: absolute;
        inset: 30px;
        border: 4px solid rgba(69, 117, 140, 0.3);
        border-radius: 38px;
      }

      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 300px;
        align-items: center;
        gap: 64px;
        padding: 96px 110px 236px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 20px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--steel);
      }

      .eyebrow::before {
        content: '';
        width: 54px;
        height: 4px;
        border-radius: 2px;
        background: var(--steel);
      }

      h1 {
        margin-top: 22px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 82px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--harbor);
      }

      h1 em {
        font-style: normal;
        color: var(--steel);
      }

      .sub {
        margin-top: 26px;
        max-width: 780px;
        font-size: 30px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 40px;
      }

      .url {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px 34px 21px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 32px;
        color: var(--foam);
        background: var(--harbor);
        border-radius: 18px;
        box-shadow: 0 16px 34px rgba(35, 49, 60, 0.24);
      }

      .url svg {
        width: 32px;
        height: 32px;
        display: block;
      }

      .flank {
        display: grid;
        justify-items: center;
        gap: 28px;
      }

      .tile {
        width: 168px;
        height: 168px;
        display: block;
        filter: drop-shadow(0 18px 34px rgba(35, 49, 60, 0.22));
      }

      .tile .tile-bg {
        fill: var(--steel);
      }

      .tile .tile-foam {
        fill: var(--foam);
      }

      .tile .tile-seaglass {
        fill: var(--seaglass);
      }

      .logo {
        width: 168px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1080 104" preserveAspectRatio="none" aria-hidden="true">
        <path
          class="wave-back"
          d="M0,42 C182,73 365,12 545,28 C727,42 902,90 1080,59 L1080,104 L0,104 Z"
        ></path>
        <path
          d="M0,73 C211,42 391,95 571,80 C751,66 931,42 1080,80 L1080,104 L0,104 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="copy">
          <!-- EDIT ME: eyebrow, two headline lines, the line under them and the
               URL pill are the whole banner. Fixed size, nowrap headline — keep
               each line about this long or it runs into the flank column. -->
          <p class="eyebrow">Morning, Coasties</p>
          <h1>You follow the group.<br />Now get the <em>newsletter</em>.</h1>
          <p class="sub">
            Everything the Coast is talking about, in your inbox before your
            Thursday coffee. Free, always.
          </p>
          <div class="cta">
            <div class="url">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9.2" stroke="#faf5ea" stroke-width="1.9" />
                <path
                  d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9Z"
                  stroke="#faf5ea"
                  stroke-width="1.9"
                  stroke-linejoin="round"
                />
              </svg>
              Sign up free &mdash; thetide.co.nz
            </div>
          </div>
        </div>

        <div class="flank">
          <!-- A rolled-up newsletter tile: the wave motif read as a page. -->
          <svg class="tile" viewBox="0 0 100 100" aria-hidden="true">
            <rect class="tile-bg" width="100" height="100" rx="24" />
            <rect class="tile-foam" x="24" y="20" width="46" height="60" rx="4" />
            <rect class="tile-seaglass" x="32" y="30" width="30" height="5" rx="2.5" />
            <rect class="tile-seaglass" x="32" y="42" width="30" height="5" rx="2.5" />
            <rect class="tile-seaglass" x="32" y="54" width="20" height="5" rx="2.5" />
            <path
              class="tile-foam"
              d="M70 62c6 0 10 4 10 9s-4 9-10 9H40c6 0 10-4 10-9V62Z"
            />
          </svg>

          <img class="logo" src="../../public/logo.webp" alt="The Tide" />
        </div>
      </main>
    </div>
  </body>
</html>
