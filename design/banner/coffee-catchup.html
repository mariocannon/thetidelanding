<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — coffee catch-up banner 450×160</title>
    <style>
      /* Fonts live with the billboard pages so there's one checked-in copy of
         each: Baloo 2 (headline), Archivo Black (URL tag), Inter (the rest). */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 450×160 of the page. */
      .banner {
        position: relative;
        width: 450px;
        height: 160px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      /* The site's own background wash, tightened to the banner's crop. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 44px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 8px;
        border: 2px solid rgba(69, 117, 140, 0.3);
        border-radius: 11px;
      }

      /* Cup and logo flank the copy: at 160px tall there's no room to stack
         them beside it the way the taller banners do. */
      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 56px 1fr 70px;
        align-items: center;
        gap: 12px;
        padding: 16px 20px 18px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before {
        content: '';
        width: 18px;
        height: 2px;
        border-radius: 1px;
        background: var(--sea);
      }

      h1 {
        margin-top: 6px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 30px;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 6px;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 10px;
      }

      .url {
        padding: 5px 10px 6px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 12px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 6px;
        box-shadow: 0 5px 11px rgba(35, 49, 60, 0.24);
      }

      .badge {
        padding: 4px 9px 5px;
        white-space: nowrap;
        font-size: 8px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 1.5px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }

      .cup {
        width: 56px;
        height: auto;
        filter: drop-shadow(0 5px 11px rgba(35, 49, 60, 0.14));
      }

      .logo {
        width: 70px;
        height: auto;
        justify-self: center;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 450 44" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,18 C76,31 152,5 227,12 C303,18 376,38 450,25 L450,44 L0,44 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,31 C88,18 163,40 238,34 C313,28 388,18 450,34 L450,44 L0,44 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <svg class="cup" viewBox="0 0 120 104" fill="none" aria-hidden="true">
          <g stroke="#a2c5d3" stroke-width="5" stroke-linecap="round">
            <path d="M45 34c-7-7 7-11 0-18" />
            <path d="M62 32c-8-8 8-13 0-21" />
            <path d="M79 34c-7-7 7-11 0-18" />
          </g>
          <path
            d="M92 52c13 0 17 5 17 11s-7 11-19 11"
            stroke="#45758c"
            stroke-width="6"
            stroke-linecap="round"
          />
          <path
            d="M27 44H93L83 86H37Z"
            fill="#faf5ea"
            stroke="#45758c"
            stroke-width="6"
            stroke-linejoin="round"
          />
          <rect x="32" y="48" width="56" height="13" rx="3" fill="#23313c" opacity="0.9" />
          <rect x="12" y="88" width="96" height="11" rx="5.5" fill="#45758c" />
        </svg>

        <div class="copy">
          <!-- EDIT ME: the three lines below are the whole ad. They're set at
               a fixed size and told not to wrap, so a line much longer than
               the headline runs into the logo instead of shrinking. -->
          <p class="eyebrow">Come say hi</p>
          <h1>Coffee <em>catch-up.</em></h1>
          <p class="sub">Dates to be confirmed</p>
          <div class="cta">
            <div class="url">thetide.co.nz</div>
            <div class="badge">All welcome</div>
          </div>
        </div>

        <img class="logo" src="../../public/logo.webp" alt="The Tide" />
      </main>
    </div>
  </body>
</html>
