<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — billboard 1408×640</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1408×640 of the page. */
      .board {
        position: relative;
        width: 1408px;
        height: 640px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      /* The site's own background wash, widened for the billboard's crop. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 176px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 26px;
        border: 3px solid rgba(69, 117, 140, 0.3);
        border-radius: 20px;
      }

      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 350px 1fr;
        align-items: center;
        gap: 76px;
        padding: 62px 78px 74px;
      }

      .mark {
        display: grid;
        justify-items: center;
        gap: 26px;
      }

      .mark img {
        width: 318px;
        height: auto;
        filter: drop-shadow(0 10px 26px rgba(35, 49, 60, 0.16));
      }

      .badge {
        display: inline-block;
        padding: 9px 20px 10px;
        white-space: nowrap;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 2px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 23px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before {
        content: '';
        width: 52px;
        height: 5px;
        border-radius: 3px;
        background: var(--sea);
      }

      h1 {
        margin-top: 18px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 116px;
        line-height: 0.92;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 22px;
        font-size: 31px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 36px;
      }

      .url {
        padding: 15px 32px 17px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 52px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(35, 49, 60, 0.28);
      }

      .free {
        padding: 15px 30px 17px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 48px;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--sky);
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(35, 49, 60, 0.28);
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1408 176" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,74 C238,124 476,22 712,48 C948,74 1176,150 1408,100 L1408,176 L0,176 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,124 C276,74 510,162 744,138 C978,114 1214,74 1408,138 L1408,176 L0,176 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="mark">
          <img src="../../public/logo.webp" alt="The Tide" />
          <p class="badge">Read by hundreds of Coasties</p>
        </div>

        <div class="copy">
          <p class="eyebrow">The Coast's newsletter</p>
          <h1>Your week<br />on the <em>Coast.</em></h1>
          <p class="sub">Local stories, news &amp; events — every week.</p>
          <div class="cta">
            <div class="url">thetide.co.nz</div>
            <div class="free">Free</div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
