<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide Facebook group banner — follow 1640×856</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      :root {
        --foam: #faf5ea;
        --sand: #f0e7d6;
        --harbor: #23313c;
        --harbor-lift: #2b3b47;
        --slate: #5a6672;
        --steel: #45758c;
        --seaglass: #a2c5d3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #1a242c;
      }

      /* 1640×856, Facebook's group cover size. Dark Harbor treatment, same as
         the other two group covers. This one leads with the reader's own
         situation the way the editor's voice does — assume the shared
         experience, then land the ask. */
      .banner {
        position: relative;
        width: 1640px;
        height: 856px;
        overflow: hidden;
        background: var(--harbor);
        font-family: 'Inter', sans-serif;
        color: var(--foam);
      }

      .aura {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(50% 62% at 82% 6%, rgba(162, 197, 211, 0.22) 0%, transparent 62%),
          radial-gradient(34% 46% at 90% 74%, rgba(162, 197, 211, 0.12) 0%, transparent 66%);
      }

      .tideline {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 150px;
        display: block;
      }

      .tideline .fill {
        fill: var(--harbor-lift);
      }

      .tideline .crest {
        fill: none;
        stroke: rgba(162, 197, 211, 0.34);
        stroke-width: 2.5;
      }

      main {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 240px;
        align-items: center;
        gap: 56px;
        padding: 104px 96px 176px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 11px 22px 12px;
        border: 1.5px solid rgba(162, 197, 211, 0.5);
        border-radius: 999px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--seaglass);
      }

      h1 {
        margin-top: 28px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 80px;
        line-height: 1;
        letter-spacing: -0.03em;
        white-space: nowrap;
        color: var(--foam);
      }

      h1 em {
        font-style: normal;
        color: var(--seaglass);
      }

      .sub {
        margin-top: 28px;
        max-width: 860px;
        font-size: 31px;
        font-weight: 500;
        line-height: 1.4;
        color: rgba(250, 245, 234, 0.68);
      }

      .cta {
        margin-top: 44px;
      }

      .url {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 20px 36px 22px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 30px;
        color: var(--harbor);
        background: var(--foam);
        border-radius: 14px;
        box-shadow: 0 22px 44px -14px rgba(0, 0, 0, 0.55);
      }

      .url svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      .flank {
        display: grid;
        justify-items: center;
        align-self: end;
        margin-bottom: 34px;
      }

      .logo {
        width: 248px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="aura"></div>

      <svg class="tideline" viewBox="0 0 1640 150" preserveAspectRatio="none" aria-hidden="true">
        <path class="fill" d="M0,66 C300,4 560,6 820,52 C1080,98 1360,112 1640,58 L1640,150 L0,150 Z" />
        <path class="crest" d="M0,66 C300,4 560,6 820,52 C1080,98 1360,112 1640,58" />
      </svg>

      <main>
        <div class="copy">
          <!-- EDIT ME: chip, two headline lines, the line under them and the URL
               button are the whole banner. Fixed-size, nowrap headline — keep
               each line about this long or it runs into the flank column. -->
          <p class="chip">Morning, Coasties</p>
          <h1>You follow the group.<br />Now get the <em>newsletter</em>.</h1>
          <p class="sub">
            Everything the Coast is talking about, in your inbox before your
            Thursday coffee. Free, always.
          </p>
          <div class="cta">
            <span class="url">
              Sign up &mdash; thetide.co.nz
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 12h13M13 6l6 6-6 6"
                  stroke="#23313c"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="flank">
          <img class="logo" src="../../public/logo.webp" alt="The Tide" />
        </div>
      </main>
    </div>
  </body>
</html>
