<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide Facebook group banner — proof 1640×856</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      :root {
        --foam: #faf5ea;
        --sand: #f0e7d6;
        --harbor: #23313c;
        --harbor-lift: #2b3b47;
        --slate: #5a6672;
        --steel: #45758c;
        --seaglass: #a2c5d3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #1a242c;
      }

      /* 1640×856, Facebook's group cover size. Dark Harbor treatment, same as
         the other two. The three chips carry the reasons to sign up — how many
         readers, when it lands, what it costs. */
      .banner {
        position: relative;
        width: 1640px;
        height: 856px;
        overflow: hidden;
        background: var(--harbor);
        font-family: 'Inter', sans-serif;
        color: var(--foam);
      }

      .aura {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(50% 62% at 82% 6%, rgba(162, 197, 211, 0.22) 0%, transparent 62%),
          radial-gradient(34% 46% at 90% 74%, rgba(162, 197, 211, 0.12) 0%, transparent 66%);
      }

      .tideline {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 150px;
        display: block;
      }

      .tideline .fill {
        fill: var(--harbor-lift);
      }

      .tideline .crest {
        fill: none;
        stroke: rgba(162, 197, 211, 0.34);
        stroke-width: 2.5;
      }

      main {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 240px;
        align-items: center;
        gap: 64px;
        padding: 92px 100px 168px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        padding: 11px 22px 12px;
        border: 1.5px solid rgba(162, 197, 211, 0.5);
        border-radius: 999px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--seaglass);
      }

      h1 {
        margin-top: 26px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 94px;
        line-height: 0.98;
        letter-spacing: -0.03em;
        white-space: nowrap;
        color: var(--foam);
      }

      h1 em {
        font-style: normal;
        color: var(--seaglass);
      }

      .sub {
        margin-top: 24px;
        max-width: 900px;
        font-size: 29px;
        font-weight: 500;
        line-height: 1.4;
        color: rgba(250, 245, 234, 0.68);
      }

      /* The three reasons as hairline chips — same language as the eyebrow, no
         filled tiles. A small Sea Glass icon, an uppercase Foam label. */
      .stats {
        margin-top: 34px;
        display: flex;
        gap: 24px;
      }

      .stat {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 22px;
        border: 1.5px solid rgba(162, 197, 211, 0.28);
        border-radius: 16px;
      }

      .stat svg {
        width: 26px;
        height: 26px;
        display: block;
        color: var(--seaglass);
        flex: none;
      }

      .stat span {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(250, 245, 234, 0.86);
      }

      .cta {
        margin-top: 40px;
      }

      .url {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 20px 36px 22px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 30px;
        color: var(--harbor);
        background: var(--foam);
        border-radius: 14px;
        box-shadow: 0 22px 44px -14px rgba(0, 0, 0, 0.55);
      }

      .url svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      .flank {
        display: grid;
        justify-items: center;
        align-self: end;
        margin-bottom: 34px;
      }

      .logo {
        width: 248px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="aura"></div>

      <svg class="tideline" viewBox="0 0 1640 150" preserveAspectRatio="none" aria-hidden="true">
        <path class="fill" d="M0,66 C300,4 560,6 820,52 C1080,98 1360,112 1640,58 L1640,150 L0,150 Z" />
        <path class="crest" d="M0,66 C300,4 560,6 820,52 C1080,98 1360,112 1640,58" />
      </svg>

      <main>
        <div class="copy">
          <!-- EDIT ME: chip, headline, the line under it, the three stat chips
               and the URL button are the whole banner. Headline is fixed-size
               and nowrap; the stat labels break only where the <br> is. -->
          <p class="chip">The Coast's newsletter</p>
          <h1>Worth <em>waiting</em> for</h1>
          <p class="sub">
            Join hundreds of Coasties who start Thursday with The Tide &mdash;
            local news, stories and what's on.
          </p>

          <div class="stats">
            <div class="stat">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="9" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.9" />
                <path d="M3.5 19c0-3.3 2.5-5.4 5.5-5.4S14.5 15.7 14.5 19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
                <path d="M16 6.2a3 3 0 0 1 0 5.6M17.5 19c0-2.6-1-4.5-2.7-5.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
              </svg>
              <span>Hundreds of<br />Coasties</span>
            </div>

            <div class="stat">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="1.9" />
                <path d="M12 7.2V12l3.4 2.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span>Every Thursday<br />at 8am</span>
            </div>

            <div class="stat">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 13.2 10.8 20l9.2-9.2V4h-6.8L4 13.2Z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" />
                <circle cx="15.4" cy="8.6" r="1.6" fill="currentColor" />
              </svg>
              <span>Free,<br />always</span>
            </div>
          </div>

          <div class="cta">
            <span class="url">
              Sign up at thetide.co.nz
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 12h13M13 6l6 6-6 6"
                  stroke="#23313c"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="flank">
          <img class="logo" src="../../public/logo.webp" alt="The Tide" />
        </div>
      </main>
    </div>
  </body>
</html>
