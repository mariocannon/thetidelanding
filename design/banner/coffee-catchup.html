<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide coffee catch-up banner 1080×150</title>
    <style>
      /* Fonts live with the billboard pages so there's one checked-in copy of
         each: Baloo 2 (headline), Archivo Black (URL tag), Inter (the rest). */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1080×150 of the page. */
      .banner {
        position: relative;
        width: 1080px;
        height: 150px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      /* The site's own background wash, tightened to the banner's crop. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 40px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 10px;
        border: 2px solid rgba(69, 117, 140, 0.3);
        border-radius: 12px;
      }

      /* One horizontal row: at 7:1 a stacked layout would leave most of the
         width empty, so the copy grows and pushes the CTA over to the logo. */
      main {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 28px;
        padding: 16px 30px 18px;
      }

      .copy {
        flex: 1;
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before {
        content: '';
        width: 26px;
        height: 3px;
        border-radius: 2px;
        background: var(--sea);
      }

      h1 {
        margin-top: 7px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 40px;
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 7px;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .url {
        padding: 9px 18px 11px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 20px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 9px;
        box-shadow: 0 7px 16px rgba(35, 49, 60, 0.24);
      }

      .badge {
        padding: 7px 14px 8px;
        white-space: nowrap;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 2px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }

      .cup {
        width: 88px;
        height: auto;
        filter: drop-shadow(0 6px 14px rgba(35, 49, 60, 0.14));
      }

      /* The logo is portrait, so at 150px tall its width is what's left after
         the padding, not a free choice. */
      .logo {
        width: 88px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1080 40" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,17 C182,28 365,5 545,11 C727,17 902,34 1080,22 L1080,40 L0,40 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,28 C212,17 391,37 571,31 C751,26 931,17 1080,31 L1080,40 L0,40 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <svg class="cup" viewBox="0 0 120 104" fill="none" aria-hidden="true">
          <g stroke="#a2c5d3" stroke-width="5" stroke-linecap="round">
            <path d="M45 34c-7-7 7-11 0-18" />
            <path d="M62 32c-8-8 8-13 0-21" />
            <path d="M79 34c-7-7 7-11 0-18" />
          </g>
          <path
            d="M92 52c13 0 17 5 17 11s-7 11-19 11"
            stroke="#45758c"
            stroke-width="6"
            stroke-linecap="round"
          />
          <path
            d="M27 44H93L83 86H37Z"
            fill="#faf5ea"
            stroke="#45758c"
            stroke-width="6"
            stroke-linejoin="round"
          />
          <rect x="32" y="48" width="56" height="13" rx="3" fill="#23313c" opacity="0.9" />
          <rect x="12" y="88" width="96" height="11" rx="5.5" fill="#45758c" />
        </svg>

        <div class="copy">
          <!-- EDIT ME: the three lines below are the whole ad. They're set at
               a fixed size and told not to wrap, so a line much longer than
               the headline runs into the logo instead of shrinking. -->
          <p class="eyebrow">Come say hi</p>
          <h1>Coffee <em>catch-up.</em></h1>
          <p class="sub">Dates to be confirmed</p>
        </div>

        <div class="cta">
          <div class="url">thetide.co.nz</div>
          <div class="badge">All welcome</div>
        </div>

        <img class="logo" src="../../public/logo.webp" alt="The Tide" />
      </main>
    </div>
  </body>
</html>
