<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — Facebook page banner 1080×400</title>
    <style>
      /* Fonts live with the billboard pages so there's one checked-in copy of
         each: Baloo 2 (headline), Archivo Black (URL tag), Inter (the rest). */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro, plus Facebook's
         own blue for the "f" tile — the one thing on the banner that has to
         read as Facebook at a glance. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
        --fb: #1877f2;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1080×400 of the page. */
      .banner {
        position: relative;
        width: 1080px;
        height: 400px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      /* The site's own background wash, tightened to the banner's crop. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 104px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 18px;
        border: 3px solid rgba(69, 117, 140, 0.3);
        border-radius: 24px;
      }

      /* Copy on the left, the "f" tile and logo stacked on the right. At 400px
         tall there's room to stack, which the 160px strip doesn't have. */
      main {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 190px;
        align-items: center;
        gap: 36px;
        padding: 44px 58px 52px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before {
        content: '';
        width: 38px;
        height: 3px;
        border-radius: 2px;
        background: var(--sea);
      }

      h1 {
        margin-top: 14px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 54px;
        line-height: 1.04;
        letter-spacing: -0.02em;
        white-space: nowrap;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 14px;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        white-space: nowrap;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 22px;
      }

      .url {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 20px 13px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 22px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 12px;
        box-shadow: 0 10px 22px rgba(35, 49, 60, 0.24);
      }

      .url svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      .badge {
        padding: 9px 18px 10px;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 2px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }

      /* The logo is a tall mark (783×979), so the stack is sized off its
         rendered height: tile + gap + logo has to stay inside main's 304px of
         content box or the logo's bottom is cropped by the banner edge. */
      .flank {
        display: grid;
        justify-items: center;
        gap: 18px;
      }

      .tile {
        width: 120px;
        height: 120px;
        display: block;
        filter: drop-shadow(0 12px 24px rgba(35, 49, 60, 0.22));
      }

      .logo {
        width: 112px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1080 104" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,42 C182,73 365,12 545,28 C727,42 902,90 1080,59 L1080,104 L0,104 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,73 C211,42 391,95 571,80 C751,66 931,42 1080,80 L1080,104 L0,104 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="copy">
          <!-- EDIT ME: the four lines below are the whole ad. They're set at a
               fixed size and told not to wrap, so keep them about this long —
               a longer line runs into the logo instead of shrinking. The
               facebook.com address is a PLACEHOLDER: put the page's real
               handle in both the URL tag and the README before this goes out. -->
          <p class="eyebrow">Find us on Facebook</p>
          <h1>Have you checked out<br />our <em>Facebook page?</em></h1>
          <p class="sub">Local news, giveaways and what's on — in your feed every day.</p>
          <div class="cta">
            <div class="url">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M13.5 22v-9h3l.5-3.5h-3.5V7.3c0-1 .3-1.7 1.8-1.7H17V2.4c-.3 0-1.4-.1-2.6-.1-2.6 0-4.4 1.6-4.4 4.5v2.7H7V13h3v9z"
                  fill="#faf5ea"
                />
              </svg>
              facebook.com/thetidenz
            </div>
            <div class="badge">Give us a follow</div>
          </div>
        </div>

        <div class="flank">
          <svg class="tile" viewBox="0 0 120 120" aria-hidden="true">
            <rect width="120" height="120" rx="30" fill="#1877f2" />
            <path
              d="M74 120V76h14.8L91 58.7H74v-11c0-5 1.4-8.4 8.6-8.4H91V23.7c-1.5-.2-6.6-.7-12.5-.7-12.4 0-20.9 7.6-20.9 21.5v12.2H43V76h14.6v44z"
              fill="#faf5ea"
            />
          </svg>

          <img class="logo" src="../../public/logo.webp" alt="The Tide" />
        </div>
      </main>
    </div>
  </body>
</html>
