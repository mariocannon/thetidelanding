<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — partner invite 1080×1080</title>
    <style>
      /* Fonts live with the billboard pages so there's one checked-in copy of
         each: Baloo 2 (headline), Archivo Black (contact tag), Inter (the
         rest). Same set the banner and billboard use. */
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1080×1080 of the page. */
      .card {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
      }

      /* The site's own background wash. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 80% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 190px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 30px;
        border: 3px solid rgba(69, 117, 140, 0.3);
        border-radius: 28px;
      }

      main {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        /* Copy never sits on the waves — BRANDING.md §2. The bottom pad clears
           the 190px wave strip with room to spare. */
        padding: 96px 104px 250px;
      }

      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .mark img {
        width: 118px;
        height: auto;
        filter: drop-shadow(0 10px 24px rgba(35, 49, 60, 0.16));
      }

      .badge {
        display: inline-block;
        padding: 9px 22px 10px;
        white-space: nowrap;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 2px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        margin-top: 52px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before,
      .eyebrow::after {
        content: '';
        width: 46px;
        height: 4px;
        border-radius: 2px;
        background: var(--sea);
      }

      h1 {
        margin-top: 24px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 74px;
        line-height: 1.02;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 28px;
        max-width: 40rem;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.42;
        color: var(--slate);
        text-wrap: balance;
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 44px;
      }

      .tag {
        padding: 15px 30px 17px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 30px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 14px;
        box-shadow: 0 12px 28px rgba(35, 49, 60, 0.26);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1080 190" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,80 C180,140 360,26 540,52 C720,78 900,160 1080,104 L1080,190 L0,190 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,132 C210,80 400,168 580,144 C760,120 940,80 1080,142 L1080,190 L0,190 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <div class="mark">
          <img src="../../public/logo.webp" alt="The Tide" />
          <span class="badge">The Coast's newsletter</span>
        </div>

        <!-- EDIT ME: eyebrow, three headline lines, one sub line. Set at a
             fixed size — keep the headline lines about this length or they run
             to the frame. -->
        <p class="eyebrow">Local partnerships</p>
        <h1>Run an email list<br />on the Coast?<br /><em>Let's team up.</em></h1>
        <p class="sub">
          You tell your people about The Tide. We put your business in front of
          hundreds of Coasties. No cost, no catch.
        </p>

        <div class="cta">
          <span class="tag">hello@thetide.co.nz</span>
        </div>
      </main>
    </div>
  </body>
</html>
