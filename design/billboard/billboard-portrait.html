<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide — billboard 1080×1920</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('inter-600.woff2') format('woff2');
      }

      /* Palette lifted straight from src/pages/index.astro. */
      :root {
        --sand: #f0e7d6;
        --sand-light: #faf5ea;
        --ink: #23313c;
        --sea: #45758c;
        --sky: #a2c5d3;
        --slate: #5a6672;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #d8cdb8;
      }

      /* The render script crops the top-left 1080×1920 of the page. */
      .board {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--sand);
        font-family: 'Inter', sans-serif;
        color: var(--ink);
        text-align: center;
      }

      /* The site's own background wash. */
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 50% 0%, var(--sand-light) 0%, var(--sand) 60%);
      }

      .waves {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 330px;
        display: block;
      }

      .frame {
        position: absolute;
        inset: 38px;
        border: 4px solid rgba(69, 117, 140, 0.3);
        border-radius: 30px;
      }

      main {
        position: relative;
        height: 100%;
        display: grid;
        justify-items: center;
        align-content: center;
        padding: 130px 84px 300px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--sea);
      }

      .eyebrow::before,
      .eyebrow::after {
        content: '';
        width: 60px;
        height: 6px;
        border-radius: 3px;
        background: var(--sea);
      }

      .mark {
        width: 520px;
        height: auto;
        margin-top: 56px;
        filter: drop-shadow(0 14px 34px rgba(35, 49, 60, 0.16));
      }

      h1 {
        margin-top: 74px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 132px;
        line-height: 0.94;
        letter-spacing: -0.02em;
        color: var(--ink);
      }

      h1 em {
        font-style: normal;
        color: var(--sea);
      }

      .sub {
        margin-top: 40px;
        max-width: 900px;
        font-size: 46px;
        font-weight: 600;
        line-height: 1.35;
        color: var(--slate);
      }

      .cta {
        display: flex;
        align-items: center;
        gap: 26px;
        margin-top: 78px;
      }

      .url {
        padding: 22px 42px 26px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 68px;
        color: var(--sand-light);
        background: var(--ink);
        border-radius: 20px;
        box-shadow: 0 18px 42px rgba(35, 49, 60, 0.28);
      }

      .free {
        padding: 22px 36px 26px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 62px;
        text-transform: uppercase;
        color: var(--ink);
        background: var(--sky);
        border-radius: 20px;
        box-shadow: 0 18px 42px rgba(35, 49, 60, 0.28);
      }

      .badge {
        display: inline-block;
        padding: 14px 32px 16px;
        margin-top: 66px;
        white-space: nowrap;
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--sea);
        background: rgba(162, 197, 211, 0.28);
        border: 3px solid rgba(69, 117, 140, 0.35);
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="board">
      <div class="glow"></div>

      <svg class="waves" viewBox="0 0 1080 330" preserveAspectRatio="none" aria-hidden="true">
        <path
          fill="#a2c5d3"
          opacity="0.45"
          d="M0,138 C182,232 364,42 546,90 C728,138 902,282 1080,188 L1080,330 L0,330 Z"
        ></path>
        <path
          fill="#a2c5d3"
          d="M0,232 C212,138 390,304 570,258 C750,212 930,138 1080,258 L1080,330 L0,330 Z"
        ></path>
      </svg>

      <div class="frame"></div>

      <main>
        <p class="eyebrow">The Coast's newsletter</p>
        <img class="mark" src="../../public/logo.webp" alt="The Tide" />
        <h1>Your week<br />on the <em>Coast.</em></h1>
        <p class="sub">Local stories, news &amp; events<br />— every week.</p>
        <div class="cta">
          <div class="url">thetide.co.nz</div>
          <div class="free">Free</div>
        </div>
        <p class="badge">Read by hundreds of Coasties</p>
      </main>
    </div>
  </body>
</html>
