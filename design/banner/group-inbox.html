<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>The Tide Facebook group banner — inbox 1640×856</title>
    <style>
      @font-face {
        font-family: 'Baloo 2';
        font-weight: 800;
        src: url('../billboard/baloo2-800.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Archivo Black';
        font-weight: 400;
        src: url('../billboard/archivoblack.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-weight: 100 900;
        src: url('../billboard/inter-600.woff2') format('woff2');
      }

      /* BRANDING §1 tokens. This set is the dark treatment — deep Harbor field,
         Foam type, one Sea Glass accent — so it reads as a distinct, modern
         thing next to the light facebook.html and stands out in a feed of
         white cards. The logo art is Sea Glass on transparent, so it sits on
         Harbor directly with no reversed asset. */
      :root {
        --foam: #faf5ea;
        --sand: #f0e7d6;
        --harbor: #23313c;
        --harbor-lift: #2b3b47;
        --slate: #5a6672;
        --steel: #45758c;
        --seaglass: #a2c5d3;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        background: #1a242c;
      }

      /* 1640×856, Facebook's group cover size. Critical copy stays inside
         generous paddings so it survives Facebook's mobile crop of the sides
         and bottom. */
      .banner {
        position: relative;
        width: 1640px;
        height: 856px;
        overflow: hidden;
        background: var(--harbor);
        font-family: 'Inter', sans-serif;
        color: var(--foam);
      }

      /* Depth, no decoration: two soft Sea Glass blooms — one top-right, a
         fainter one low behind the logo so it doesn't sit in dead space. No
         framed border, no radial sand wash. */
      .aura {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(50% 62% at 82% 6%, rgba(162, 197, 211, 0.22) 0%, transparent 62%),
          radial-gradient(34% 46% at 90% 74%, rgba(162, 197, 211, 0.12) 0%, transparent 66%);
      }

      /* One clean curve instead of the two-path shoreline — a tonal step up in
         the Harbor, with a thin Sea Glass highlight riding its crest. */
      .tideline {
        position: absolute;
        inset: auto 0 0;
        width: 100%;
        height: 150px;
        display: block;
      }

      .tideline .fill {
        fill: var(--harbor-lift);
      }

      .tideline .crest {
        fill: none;
        stroke: rgba(162, 197, 211, 0.34);
        stroke-width: 2.5;
      }

      main {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 240px;
        align-items: center;
        gap: 64px;
        padding: 104px 100px 176px;
      }

      .copy {
        display: grid;
        justify-items: start;
      }

      /* Modern eyebrow: a hairline pill, no leading dash. */
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 11px 22px 12px;
        border: 1.5px solid rgba(162, 197, 211, 0.5);
        border-radius: 999px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--seaglass);
      }

      h1 {
        margin-top: 30px;
        font-family: 'Baloo 2', sans-serif;
        font-weight: 800;
        font-size: 108px;
        line-height: 0.98;
        letter-spacing: -0.03em;
        white-space: nowrap;
        color: var(--foam);
      }

      h1 em {
        font-style: normal;
        color: var(--seaglass);
      }

      .sub {
        margin-top: 30px;
        max-width: 820px;
        font-size: 31px;
        font-weight: 500;
        line-height: 1.4;
        color: rgba(250, 245, 234, 0.68);
      }

      .cta {
        margin-top: 46px;
      }

      /* Flat, tight-radius button — no chunky pill, minimal shadow, a trailing
         arrow. A group cover can't be hyperlinked, so it names the address. */
      .url {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        padding: 20px 36px 22px;
        font-family: 'Archivo Black', sans-serif;
        font-size: 32px;
        color: var(--harbor);
        background: var(--foam);
        border-radius: 14px;
        box-shadow: 0 22px 44px -14px rgba(0, 0, 0, 0.55);
      }

      .url svg {
        width: 30px;
        height: 30px;
        display: block;
      }

      .flank {
        display: grid;
        justify-items: center;
        align-self: end;
        margin-bottom: 34px;
      }

      .logo {
        width: 248px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="aura"></div>

      <svg class="tideline" viewBox="0 0 1640 150" preserveAspectRatio="none" aria-hidden="true">
        <path class="fill" d="M0,66 C300,4 560,6 820,52 C1080,98 1360,112 1640,58 L1640,150 L0,150 Z" />
        <path class="crest" d="M0,66 C300,4 560,6 820,52 C1080,98 1360,112 1640,58" />
      </svg>

      <main>
        <div class="copy">
          <!-- EDIT ME: the chip, the two headline lines, the line under them and
               the URL button are the whole banner. The headline is fixed-size
               and told not to wrap, so keep each line about this long or it runs
               into the flank column. -->
          <p class="chip">For everyone in this group</p>
          <h1>Get The Tide<br />in your <em>inbox</em></h1>
          <p class="sub">
            The week's local news, stories and events from the Coast. Free, every
            Thursday at 8am.
          </p>
          <div class="cta">
            <span class="url">
              thetide.co.nz
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M5 12h13M13 6l6 6-6 6"
                  stroke="#23313c"
                  stroke-width="2.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
          </div>
        </div>

        <div class="flank">
          <img class="logo" src="../../public/logo.webp" alt="The Tide" />
        </div>
      </main>
    </div>
  </body>
</html>
